name: Flutter Android Build (Release)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────
      # 1. Checkout code
      # ─────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────
      # 2. Setup Java (Android requirement)
      # ─────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ─────────────────────────────
      # 3. Setup Flutter (PINNED VERSION FILE)
      # ─────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          cache: true

      # ─────────────────────────────
      # 4. Verify environment
      # ─────────────────────────────
      - name: Flutter doctor
        run: flutter doctor -v

      # ─────────────────────────────
      # 5. Install dependencies
      # ─────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ─────────────────────────────
      # 6. Static analysis (FAIL FAST)
      # ─────────────────────────────
      - name: Analyze code
        run: flutter analyze

      # ─────────────────────────────
      # 7. Run tests
      # ─────────────────────────────
      - name: Run tests
        run: flutter test

      # ─────────────────────────────
      # 8. Build release APK
      # ─────────────────────────────
      - name: Build APK (Release)
        run: flutter build apk --release

      # ─────────────────────────────
      # 9. Upload artifact
      # ─────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
