engine:
  mode: closed_loop

  input:
    - logs
    - build_output
    - git_diff

  state:
    current: IDLE
    last_error: null

  failure_detection:
    patterns:
      - compile_error
      - test_failure
      - dependency_error
      - runtime_crash

  truth_source_priority:
    order:
      - build_output
      - test_results
      - static_analysis
      - logs
      - git_diff

  loop:
    - detect_failure
    - if no_failure -> stay_idle
    - analyze_root_cause
    - generate_single_fix
    - pre_apply_validation
    - simulate_fix
    - if pass -> apply
    - else -> rollback
    - update_state

  pre_apply_validation:
    required_checks:
      - patch_is_isolated
      - no_unrelated_files_modified
      - no_api_contract_break
      - dependency_stability_check

  simulate:
    steps:
      - dry_run_build
      - run_tests
      - static_analysis

  rollback:
    strategy: git_restore
    checkpoint: pre_patch_commit

  success_criteria:
    must_be_true:
      - build_output_contains: "0 errors"
      - test_suite_passed: true
      - no_new_errors_after_patch: true

  termination:
    condition:
      - success_criteria_met
      - or max_cycles_reached

    max_cycles: 3

  state_transitions:
    IDLE: [ANALYZING]
    ANALYZING: [SIMULATING, ROLLBACK]
    SIMULATING: [APPLYING, ROLLBACK]
    APPLYING: [VALIDATING, ROLLBACK]
    VALIDATING: [IDLE, ROLLBACK]

  rules:
    - one_fix_only
    - no_parallel_cycles
    - must_have_rollback
    - deterministic_execution_only
    - no_partial_apply_allowed
