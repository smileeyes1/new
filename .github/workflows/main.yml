name: Flutter Android Build (Release)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────
      # 1. Checkout repository
      # ─────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────
      # 2. Setup Java (required for Android Gradle)
      # ─────────────────────────────
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ─────────────────────────────
      # 3. Setup Flutter SDK
      # ─────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "stable"
          cache: true

      # ─────────────────────────────
      # 4. Verify Flutter environment
      # ─────────────────────────────
      - name: Flutter doctor
        run: flutter doctor -v

      # ─────────────────────────────
      # 5. Get dependencies
      # ─────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ─────────────────────────────
      # 6. Code analysis (IMPORTANT - stops bad builds early)
      # ─────────────────────────────
      - name: Analyze code
        run: flutter analyze

      # ─────────────────────────────
      # 7. Run tests (if any)
      # ─────────────────────────────
      - name: Run tests
        run: flutter test

      # ─────────────────────────────
      # 8. Build Release APK
      # ─────────────────────────────
      - name: Build APK (Release)
        run: flutter build apk --release

      # ─────────────────────────────
      # 9. Upload artifact (optional but recommended)
      # ─────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
