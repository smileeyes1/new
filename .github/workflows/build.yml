name: Flutter Android Build (Fail-Safe)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04   # تثبيت النظام - ليس latest

    env:
      JAVA_HOME: /usr/lib/jvm/temurin-11-jdk-amd64
      PATH: /usr/lib/jvm/temurin-11-jdk-amd64/bin:${{ env.PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ قفل Java بشكل جذري
      - name: Install Java 11 (hard-pinned)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          check-latest: false

      # ✅ تأكيد فعلي (حاسم)
      - name: Verify Java
        run: |
          java -version
          javac -version

      # ✅ تثبيت Flutter ثابت
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.0'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Pub Get
        run: flutter pub get

      # ✅ قفل Gradle Daemon
      - name: Disable Gradle Daemon
        run: |
          echo "org.gradle.daemon=false" >> android/gradle.properties

      # ✅ البناء النهائي
      - name: Build Release APK
        run: flutter build apk --release --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
