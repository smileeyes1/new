name: Flutter Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ جلب الكود
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ تثبيت Java 11 (الحل الذري الأساسي)
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 3️⃣ تثبيت Flutter (نسخة مستقرة)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4️⃣ التحقق من البيئة
      - name: Flutter Doctor
        run: flutter doctor -v

      # 5️⃣ تحميل الحزم
      - name: Flutter Pub Get
        run: flutter pub get

      # 6️⃣ بناء APK (Release)
      - name: Build APK
        run: flutter build apk --release

      # 7️⃣ رفع الـ APK كـ Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
